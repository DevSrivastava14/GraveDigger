[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravedigger"
version = "0.1.0"
description = "Dig up the files your repo buried."
requires-python = ">=3.11"
dependencies = ["click>=8.1", "ollama>=0.3", "jinja2>=3.1", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gravedigger = "gravedigger.cli:main"

[tool.setuptools.packages.find]
include = ["gravedigger*"]